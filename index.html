<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Food Point - Contact Us</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- Header Start -->
    <header class="header">
        <!-- Logo -->
        <div class="left">
            <img src="images/logo.png" alt="My Food Point logo" />
        </div>

        <!-- Navigation -->
        <nav class="mid">
            <ul class="navbar">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>

        <!-- Order Button -->
        <div class="right">
            <button class="btn" type="button">Order Now</button>
        </div>
    </header>
    <!-- Header End -->

    <!-- Contact Form Start -->
    <main>
        <div class="container">
            <h1>Contact Us</h1>

            <form action="#" method="post">
                <div class="form-group">
                    <input type="text" name="name" placeholder="Your Name" required />
                </div>

                <div class="form-group">
                    <input type="email" name="email" placeholder="Your Email" required />
                </div>

                <div class="form-group">
                    <input type="tel" name="contact" placeholder="Your Contact" />
                </div>

                <div class="form-group">
                    <textarea name="message" placeholder="Your Message"></textarea>
                </div>

                <button type="submit">Submit</button>
            </form>
        </div>
    </main>
    <!-- Contact Form End -->

    <!-- Footer Start -->
    <footer class="footer">
        <p>© 2026 My Food Point. All Rights Reserved.</p>
    </footer>
    <!-- Footer End -->
</body>

</html>
